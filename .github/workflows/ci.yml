name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Unit tests + build
        run: mvn -B clean install

      - name: Integration test against a real Qdrant container
        # Docker is preinstalled on GitHub-hosted Linux runners, so the testcontainers IT that
        # fails to detect Docker from a native Windows JVM (see README) runs fine here.
        run: mvn -B -pl flink-connector-qdrant verify
